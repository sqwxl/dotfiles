onboarding = false
[terminal]
default_shell = "fish"

[ui.sound]
enabled = false

[theme]
# Herdr's "terminal" theme maps dim text to ANSI 7, which is a light color in
# every light terminal theme, so it cannot carry text on a light background.
# Hence a purpose-built light theme rather than inheriting ghostty's palette.
auto_switch = true
dark_name = "gruvbox"
light_name = "one-light"

# [theme.custom] is one flat table, not one per mode, so anything here has to
# hold up against both one-light (#fafafa) and gruvbox (#282828).
[theme.custom]
# Unfocused sidebar and tab labels. one-light ships #a0a1a7, only 2.47:1 on its
# own background; no light theme herdr ships clears 3:1. This mid-grey is the
# best simultaneous fit: 3.68:1 on light, 3.84:1 on dark. Costs dark mode some
# contrast (gruvbox's own #a89984 is 5.30:1) to get light mode over 3:1.
subtext0 = "#828282"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false

[keys]
# Needs the kitty keyboard protocol, which ghostty provides.
prefix = "ctrl+comma"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+t"
focus_pane_up = "prefix+c"
focus_pane_right = "prefix+n"

last_pane = "prefix+comma"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

navigate_pane_left = "h"
navigate_pane_down = "t"
navigate_pane_up = "c"
navigate_pane_right = "n"

# displaced by the movement keys above
new_tab = "prefix+shift+t"
rename_tab = "prefix+shift+c"
next_tab = "prefix+tab"
previous_tab = "prefix+shift+tab"

# the parser has no pageup/pagedown, so arrows stand in for them
previous_agent = "prefix+up"
next_agent = "prefix+down"

toggle_sidebar = "prefix+e" # default is prefix+b
edit_scrollback = ""        # unused
