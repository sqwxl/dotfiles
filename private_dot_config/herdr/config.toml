onboarding = false
[terminal]
default_shell = "fish"

[ui.sound]
enabled = false

[theme]
# The "terminal" theme maps dim text to ANSI 7 and dim fills to ANSI 8. Both are
# light colors, so they only read as text over a dark background. Against Light
# Owl's #fbfbfb they land at 1.82:1 and 2.56:1, well under the 4.5:1 that text
# needs. So inherit only in dark mode and use a real light theme otherwise.
auto_switch = true
dark_name = "terminal"
light_name = "one-light"

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false

[keys]
# Needs the kitty keyboard protocol, which ghostty provides.
prefix = "ctrl+comma"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+t"
focus_pane_up = "prefix+c"
focus_pane_right = "prefix+n"

last_pane = "prefix+comma"

navigate_workspace_up = "k"
navigate_workspace_down = "j"

navigate_pane_left = "h"
navigate_pane_down = "t"
navigate_pane_up = "c"
navigate_pane_right = "n"

# displaced by the movement keys above
new_tab = "prefix+shift+t"
rename_tab = "prefix+shift+c"
next_tab = "prefix+tab"
previous_tab = "prefix+shift+tab"

# the parser has no pageup/pagedown, so arrows stand in for them
previous_agent = "prefix+up"
next_agent = "prefix+down"

toggle_sidebar = "prefix+e" # default is prefix+b
edit_scrollback = ""        # unused
